# gcovr.cfg — auto-discovered by gcovr when Meson invokes it via `ninja coverage*`.
# NOTE: the mere presence of this file disables Meson's own default `-e subprojects`
# exclusion (mesonbuild/scripts/coverage.py), so every exclude below is load-bearing.
# Do NOT set `root =` here — rely on Meson's CLI-supplied `-r`.
# Match any build directory name (build/, build-cov/, builddir/, …). gcovr excludes
# are unanchored re.search, so anchor on a path boundary to avoid matching a source
# dir that merely contains "build".
exclude = (^|/)build[^/]*/.*
# Exclude vendored subprojects EXCEPT ukeysequence.{cpp,h}: we carry a Qt 6 port +
# operator[] OOB fix in that file (subprojects/packagefiles/uglobalhotkey/*.patch) and
# own its unit tests, so for our coverage it is first-party, not pristine-external.
# Negative lookahead: match "subprojects/" only when NOT followed by our patched file,
# so every other subproject file stays excluded while ukeysequence.cpp/.h is counted.
exclude = subprojects/(?!uglobalhotkey/ukeysequence\.)
exclude = .*moc_.*\.cpp$
exclude = .*ui_.*\.h$
exclude = .*qrc_.*\.cpp$
exclude-unreachable-branches = yes
exclude-throw-branches = yes
